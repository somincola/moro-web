name: Sync App Store release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-app-store-release
  cancel-in-progress: false

jobs:
  sync:
    name: Synchronize public release data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Read public App Store release
        run: pnpm sync:release

      - name: Detect a new public release
        id: release
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- src/data/app-store-release.json)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify generated release data
        if: steps.release.outputs.changed == 'true'
        run: pnpm test:release-sync

      - name: Build website
        if: steps.release.outputs.changed == 'true'
        run: pnpm build

      - name: Commit public release update
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/app-store-release.json
          git commit -m "Update App Store release data"
          git push origin HEAD:main
